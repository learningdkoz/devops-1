# pyproject.toml — единый дом для зависимостей и конфигов тулзовья.
# Сюда же повешены настройки ruff/mypy/pytest/coverage, чтобы CI и локальный
# запуск работали одинаково.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devops-demo"
version = "0.1.0"
description = "Демонстрационный сервис для прогона DevOps quality gates"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Dmitry Kozyrin" }]
license = { text = "MIT" }
# Runtime-зависимостей нет — приложение на stdlib, это плюс к CI-08 (SCA).
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "coverage>=7",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]

[project.scripts]
devops-demo = "app.server:main"

[tool.setuptools.packages.find]
include = ["app*"]

# ── Ruff: линтер + форматтер (CI-04) ────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Базовый набор: pycodestyle, pyflakes, isort, bugbear, simplify, pyupgrade.
select = ["E", "F", "I", "B", "SIM", "UP", "N"]
ignore = ["E203"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]

# ── Mypy: строгая типизация (CI-05) ─────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
files = ["app"]

# ── Pytest + coverage (CI-10/CI-11) ─────────────────────────────────────────
[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise SystemExit",
]

# ── Bandit (CI-06, SAST на питон-специфику) ─────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
