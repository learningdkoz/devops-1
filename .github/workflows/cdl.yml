# CDL pipeline — Continuous Delivery.
# Стартует, когда CI зелёный и образ в registry. ID job'ов соответствуют QG.CDL.X.

name: CDL

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Тег образа для деплоя"
        required: true

permissions:
  contents: read
  packages: read
  deployments: write
  id-token: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  STAGING_URL: https://staging.devops-demo.example.com

jobs:
  guard:
    name: Проверка, что CI был зелёный
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    steps:
      - run: echo "CI ok, поехали в staging"

  # ─── QG.CDL.1 BVT ─────────────────────────────────────────────────────────
  bvt:
    name: QG.CDL.1 BVT
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: BVT — проверка работоспособности перед СТ
        run: pytest tests/test_server.py -q

  # ─── QG.CDL.2 Helm / Manifest Lint ────────────────────────────────────────
  manifest-lint:
    name: QG.CDL.2 Helm / Manifest Lint
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.15.2 }
      - run: helm lint deploy/helm
      - uses: yannh/kubeconform-action@v1
        with: { files: deploy/k8s }

  # ─── Деплой на staging (нужен для последующих ST/IFT) ─────────────────────
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [bvt, manifest-lint]
    environment:
      name: staging
      url: ${{ env.STAGING_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: { version: v3.15.2 }
      - name: kubeconfig
        run: echo "${{ secrets.KUBECONFIG_STAGING }}" | base64 -d > $HOME/.kube/config
      - name: helm upgrade --install
        run: |
          TAG="${{ github.event.inputs.image_tag || github.sha }}"
          helm upgrade --install devops-demo deploy/helm \
            --namespace devops-demo-staging --create-namespace \
            --set image.tag=$TAG --wait --timeout 5m

  # ─── QG.CDL.3 Smoke ST ────────────────────────────────────────────────────
  smoke-st:
    name: QG.CDL.3 Smoke ST
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh "${{ env.STAGING_URL }}"

  # ─── QG.CDL.4 Smart Regress ST ────────────────────────────────────────────
  smart-regress-st:
    name: QG.CDL.4 Smart Regress ST
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - name: ST на заглушках (smart regress)
        run: pytest tests/ -q -m "not integration"

  # ─── QG.CDL.5 NF ST ───────────────────────────────────────────────────────
  nf-st:
    name: QG.CDL.5 NF ST
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "::notice::NF ST — прогон тестов нового функционала на заглушках"'

  # ─── QG.CDL.6 Smoke IFT ───────────────────────────────────────────────────
  smoke-ift:
    name: QG.CDL.6 Smoke IFT
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/smoke.sh "${{ env.STAGING_URL }}"

  # ─── QG.CDL.7 Smart Regress IFT ───────────────────────────────────────────
  smart-regress-ift:
    name: QG.CDL.7 Smart Regress IFT
    runs-on: ubuntu-latest
    needs: smoke-ift
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -e ".[dev]"
      - run: pytest tests/test_server.py -q

  # ─── QG.CDL.8 NF IFT ──────────────────────────────────────────────────────
  nf-ift:
    name: QG.CDL.8 NF IFT
    runs-on: ubuntu-latest
    needs: smoke-ift
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "::notice::NF IFT — тесты новой интеграционной функциональности"'

  # ─── QG.CDL.9 DAST ────────────────────────────────────────────────────────
  dast:
    name: QG.CDL.9 DAST
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: zaproxy/action-baseline@v0.12.0
        with:
          target: ${{ env.STAGING_URL }}
          fail_action: false

  # ─── QG.CDL.10 LT (Load Testing) ──────────────────────────────────────────
  lt:
    name: QG.CDL.10 LT
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run -e BASE_URL=${{ env.STAGING_URL }} scripts/perf.js

  # ─── QG.CDL.11 DB Migration Dry-run ───────────────────────────────────────
  db-migrate-dryrun:
    name: QG.CDL.11 DB Migration Dry-run
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - run: 'echo "::notice::dry-run миграций через Flyway/Liquibase на shadow-БД"'

  # ─── QG.CDL.12 Deploy to Staging — формально подтверждаем gate ───────────
  deploy-confirm:
    name: QG.CDL.12 Deploy to Staging Confirmed
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - run: echo "ok — релиз в staging выкатан"

  # ─── QG.CDL.13 Contract Tests ─────────────────────────────────────────────
  contract:
    name: QG.CDL.13 Contract Tests
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::pact-broker can-i-deploy"'

  # ─── QG.CDL.14 API Backward Compatibility ─────────────────────────────────
  api-compat:
    name: QG.CDL.14 API Backward Compatibility
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: oasdiff/oasdiff-action/breaking@main
        with:
          base: https://raw.githubusercontent.com/${{ github.repository }}/main/openapi.yaml
          revision: openapi.yaml

  # ─── QG.CDL.15 E2E Tests ──────────────────────────────────────────────────
  e2e:
    name: QG.CDL.15 E2E
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::здесь npx playwright test"'

  # ─── QG.CDL.16 Visual Regression ──────────────────────────────────────────
  visual:
    name: QG.CDL.16 Visual Regression
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::здесь Percy/Chromatic snapshot"'

  # ─── QG.CDL.17 Accessibility ──────────────────────────────────────────────
  a11y:
    name: QG.CDL.17 Accessibility
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::здесь axe-core/pa11y"'

  # ─── QG.CDL.18 Stress Test ────────────────────────────────────────────────
  stress:
    name: QG.CDL.18 Stress Test
    runs-on: ubuntu-latest
    needs: lt
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run --vus 200 --duration 2m -e BASE_URL=${{ env.STAGING_URL }} scripts/perf.js

  # ─── QG.CDL.19 Soak Test ──────────────────────────────────────────────────
  soak:
    name: QG.CDL.19 Soak Test
    runs-on: ubuntu-latest
    needs: lt
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - run: k6 run --vus 20 --duration 30m -e BASE_URL=${{ env.STAGING_URL }} scripts/perf.js

  # ─── QG.CDL.20 Penetration Test ──────────────────────────────────────────
  pentest:
    name: QG.CDL.20 Penetration Test
    runs-on: ubuntu-latest
    needs: dast
    continue-on-error: true
    steps:
      - run: 'echo "::notice::внешний пентест на ключевых релизах"'

  # ─── QG.CDL.21 Chaos Engineering ─────────────────────────────────────────
  chaos:
    name: QG.CDL.21 Chaos Engineering
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::litmus/chaos-mesh experiment"'

  # ─── QG.CDL.22 Resource Quota ────────────────────────────────────────────
  resource-quota:
    name: QG.CDL.22 Resource Quota
    runs-on: ubuntu-latest
    needs: manifest-lint
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker run --rm -v $PWD:/src zegl/kube-score:latest score \
            /src/deploy/k8s/*.yaml || true

  # ─── QG.CDL.23 Cost Estimation ───────────────────────────────────────────
  cost:
    name: QG.CDL.23 Cost Estimation
    runs-on: ubuntu-latest
    needs: manifest-lint
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - run: 'echo "::notice::infracost breakdown по terraform-плану"'

  # ─── QG.CDL.24 SLSA Provenance ───────────────────────────────────────────
  provenance:
    name: QG.CDL.24 SLSA Provenance
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: sigstore/cosign-installer@v3
      - name: verify provenance
        run: |
          cosign verify-attestation \
            --type slsaprovenance \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            ${{ env.IMAGE_NAME }}:${{ github.sha }} || true

  # ─── QG.CDL.25 Image Promotion ───────────────────────────────────────────
  promote:
    name: QG.CDL.25 Image Promotion
    runs-on: ubuntu-latest
    needs: [smoke-st, lt, dast]
    steps:
      - uses: imjasonh/setup-crane@v0.4
      - run: |
          crane tag ${{ env.IMAGE_NAME }}:${{ github.sha }} staging-ok

  # ─── QG.CDL.26 Manual QA Sign-off ────────────────────────────────────────
  qa-signoff:
    name: QG.CDL.26 Manual QA Sign-off
    runs-on: ubuntu-latest
    needs: [smoke-st, lt, dast]
    environment: qa-signoff
    steps:
      - run: echo "QA подтвердил релиз"

  # ─── QG.CDL.27 Release Notes ─────────────────────────────────────────────
  release-notes:
    name: QG.CDL.27 Release Notes
    runs-on: ubuntu-latest
    needs: smoke-st
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: googleapis/release-please-action@v4
        with:
          release-type: python

  # ─── QG.CDL.28 Feature Flags Defined ─────────────────────────────────────
  feature-flags:
    name: QG.CDL.28 Feature Flags Defined
    runs-on: ubuntu-latest
    needs: smoke-st
    continue-on-error: true
    steps:
      - run: 'echo "::notice::проверка, что новые фичи закрыты флагами в Unleash"'
